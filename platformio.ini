; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin_s2_mini

[env:lolin_s2_mini]
platform = espressif32 @ 6.11.0  ; arduino-esp32 2.0.17 (framework 3.20017.241212), ESP-IDF 4.4, ESP-NOW v1
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.variants_dir = variants
board_build.variant = lolin_s2_mini_tt  ; 0.6.10: the stock variant with the USB serial from the chip MAC (variants/lolin_s2_mini_tt)
; Upload button: this firmware -> update over USB; any other firmware -> full install (tools/upload_auto.py)
; tools/gen_telemetry_def_build.py: the telemetry definition of the build (<build folder>/telemetry_def.json)
extra_scripts = pre:tools/pio_path_map.py, post:tools/pio_upload_hook.py, pre:tools/gen_telemetry_def_build.py
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
	arduino-libraries/Servo@^1.2.1
	br3ttb/PID@^1.2.1
	rfetick/MPU6050_light@^1.1.0
	adafruit/Adafruit MPU6050@^2.2.6
	tinyusb_dcd_fix  ; lib/tinyusb_dcd_fix: replaces the TinyUSB ESP32-S2 device driver of the framework (USB stop fix)
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-I include  ; libraries (lib/stm_v2) see the shared STM32 headers
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D TELEMLOG_FAST_SLOTS=10
	-D TELEMLOG_SLOW_SLOTS=24
	-Wl,--wrap=esp_panic_handler  ; src/panic_record.cpp: the reason, PC and backtrace of a panic, printed at the next boot

; Diagnostic build: USB serial first, the reset reason, one line per start-up step (src/platform/board.inc TRACE)
[env:boot_trace]
extends = env:lolin_s2_mini
build_flags = ${env:lolin_s2_mini.build_flags} -D BOOT_TRACE

; OTA test images (update over Wi-Fi, test/bench/ota_check.py; update page, test/bench/update_page_check.py): the normal
; firmware with another version string.
; ota_a and ota_b: two good images for the alternating test. ota_test_crash: a new image that panics 2 s after start.
[env:ota_a]
extends = env:lolin_s2_mini
build_flags = ${env:lolin_s2_mini.build_flags} '-D OTA_TEST_VERSION="0.6.18-a"'

[env:ota_b]
extends = env:lolin_s2_mini
build_flags = ${env:lolin_s2_mini.build_flags} '-D OTA_TEST_VERSION="0.6.18-b"'

[env:ota_test_crash]
extends = env:lolin_s2_mini
build_flags = ${env:lolin_s2_mini.build_flags} -D OTA_TEST_CRASH '-D OTA_TEST_VERSION="0.6.18-crash"'

; Settings table, self-check build: the settings code of 0.5.111 (src/settings_selftest_old.inc) beside the table
; code, and the USB command "cfgselftest" (field-by-field comparison, no flash write)
[env:settings_selftest]
extends = env:lolin_s2_mini
build_flags = ${env:lolin_s2_mini.build_flags} -D SETTINGS_SELFTEST

; Settings table, one new setting: test_new_setting (int, default 7, range 0 to 100) as one table line behind
; this flag; the build also writes its settings definition (tools/gen_settings_def.py) to the build folder
[env:settings_newkey]
extends = env:lolin_s2_mini
build_flags = ${env:lolin_s2_mini.build_flags} -D SETTINGS_NEWKEY
extra_scripts =
	pre:tools/pio_path_map.py
	post:tools/pio_upload_hook.py
	pre:tools/gen_settings_def_build.py
	pre:tools/gen_telemetry_def_build.py

; Telemetry table, the example lines: four values of include/user_telemetry.h behind this flag (log rate: Rx STM32
; frame count and wire radius; 10 Hz: drive command; 1 Hz: free heap), set in src/main.cpp; the build writes their
; definition to <build folder>/telemetry_def.json
[env:telemetry_newvalue]
extends = env:lolin_s2_mini
build_flags = ${env:lolin_s2_mini.build_flags} -D TELEMETRY_NEWVALUE
