; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin_s2_mini

[env:lolin_s2_mini]
platform = espressif32 @ 6.11.0  ; arduino-esp32 2.0.17 (framework 3.20017.241212), ESP-IDF 4.4, ESP-NOW v1
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
; Upload button: this firmware -> update over USB; any other firmware -> full install (tools/upload_auto.py)
extra_scripts = post:tools/pio_upload_hook.py
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
lib_deps =
	bblanchon/ArduinoJson@^7.0.0
	arduino-libraries/Servo@^1.2.1
	br3ttb/PID@^1.2.1
	rfetick/MPU6050_light@^1.1.0
	adafruit/Adafruit MPU6050@^2.2.6
build_flags =
	-D CORE_DEBUG_LEVEL=0
	-I include  ; libraries (lib/stm_v2) see the shared STM32 headers
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D TELEMLOG_FAST_SLOTS=10
	-D TELEMLOG_SLOW_SLOTS=24
	-D TELEMLOG_FLASH_ERASED_AHEAD=48  ; 48 sectors x 32 s: about 25 min of driving with no erase (an erase loses 3-4 STM32 packets)

; Diagnostic build: USB serial first, the reset reason, one line per start-up step (src/main.cpp TRACE)
[env:boot_trace]
extends = env:lolin_s2_mini
build_flags = ${env:lolin_s2_mini.build_flags} -D BOOT_TRACE
